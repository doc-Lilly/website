<style>
:root{--bg:#FBF8F1;--blue:#1F3254;--rg:#3E5A94;--ch:#E8D88F;--fu:#2B4A86;--cream:#FFFBE6;--mute:#5E6A85;--ind:#1F3254;--grn:#2E7D6B;--yel:#F6C945;--but:#FCEEA8}
*{box-sizing:border-box}
body{margin:0;font-family:Quicksand,system-ui,sans-serif;color:var(--blue);background:var(--bg);
padding:0 0 calc(24px + env(safe-area-inset-bottom,0))}
h1,h2{font-family:'Great Vibes','Snell Roundhand',cursive;margin:0;font-weight:400}
header{padding:20px 20px 4px;display:flex;align-items:center;gap:10px}
header h1{font-size:40px;line-height:1}header small{color:var(--mute);display:block;font-size:12px}
main{padding:8px 16px;max-width:640px;margin:auto}
.card{background:var(--cream);border:1.5px solid var(--rg);border-radius:20px;padding:16px;margin:12px 0}
.card h2{font-size:32px;line-height:1.1;margin-bottom:8px}
input,textarea,select,button{font:inherit;color:inherit}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--ch);border-radius:12px;background:#fff;margin:4px 0}
textarea{min-height:70px}
button{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:10px 16px;cursor:pointer}
button.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--rg)}
button.big{width:100%;padding:18px;margin:6px 0;font-size:17px;border-radius:18px}
button.fu{background:var(--fu)}
button.x{background:none;color:var(--mute);padding:4px 8px}
:focus-visible{outline:2px solid var(--fu);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
.tabs{display:flex;gap:8px;margin:8px 0}.tabs button{flex:1}
.tag{display:inline-block;background:var(--ch);border-radius:20px;padding:2px 10px;font-size:12px}
.note{background:#FFF6C9;border-left:4px solid var(--fu);padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.5;margin:10px 0}
.paper{background:var(--cream);border:1.5px solid var(--rg);border-radius:20px;padding:18px;margin:12px 0}
.pdate{margin-bottom:12px}.pdate h2{font-size:40px}.pdate small{color:var(--mute)}
.line{display:flex;gap:10px;align-items:center;min-height:36px}.line span{flex:1}.line em{color:var(--fu);font-size:13px;font-style:normal}
.line input[type=checkbox],.item input[type=checkbox]{width:22px;height:22px;accent-color:var(--grn);margin:0;flex:0 0 auto}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--ch)}.item span{flex:1}
#welcome{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;align-items:center;justify-content:center;padding:24px}
#welcome .box{background:var(--cream);border:3px solid var(--ind);border-radius:32px;padding:28px 22px;max-width:360px;text-align:center}
.q{font-family:'Great Vibes','Snell Roundhand',cursive;font-size:34px;color:var(--fu);margin:8px 0}
.sud{display:grid;grid-template-columns:repeat(9,1fr);max-width:360px;margin:auto;border:2px solid var(--blue)}
.sud input{text-align:center;padding:0;margin:0;border:1px solid #E8D88F;border-radius:0;height:36px;font-size:17px}
.sud input[readonly]{background:#FBEFB0;font-weight:600}
.sud input:nth-child(3n){border-right:2px solid var(--blue)}
.sud input:nth-child(n+19):nth-child(-n+27),.sud input:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--blue)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cream);border-top:1.5px solid var(--rg);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0))}
nav button{flex:1;background:none;color:var(--mute);font-size:10px;padding:4px 0}
nav button.on{color:var(--fu);font-weight:600}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0));left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;padding:12px 18px;border-radius:16px;z-index:30;display:none;border:2px solid var(--fu)}
a{color:var(--fu)}
button.big{display:flex;gap:10px;align-items:center;justify-content:center}
h2 svg{vertical-align:-4px;color:var(--rg);margin-right:4px}
nav button svg{display:block;margin:0 auto 2px}
.card[data-a]{cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--cream);color:var(--blue);border:1.5px solid var(--rg);border-radius:22px;padding:24px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600;font-size:15px}
.tile svg{color:var(--rg)}
.hero{background:var(--fu);color:var(--cream);border:2px solid var(--rg);border-radius:26px;padding:22px 18px;text-align:center;box-shadow:0 10px 24px rgba(31,50,84,.22);margin:12px 0}
.hero h2{font-size:46px;color:#FCEEA8}.hero p{margin:0}.orn{color:var(--rg);letter-spacing:10px;font-size:11px;margin:4px 0 10px}
.tile{box-shadow:0 6px 16px rgba(31,50,84,.08)}
.tile .ib{width:72px;height:72px;border-radius:50%;border:1.5px solid var(--rg);display:flex;align-items:center;justify-content:center;background:#FFFDEB;box-shadow:inset 0 0 0 4px #FBEFA8}
.card{box-shadow:0 6px 16px rgba(31,50,84,.07)}
header{border-bottom:1px solid var(--ch);padding-bottom:10px;margin-bottom:6px}

html{background:#FBF8F1}
body{background:transparent;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
radial-gradient(circle at 106% 6%,rgba(31,50,84,.07) 0 120px,transparent 122px),
radial-gradient(circle at -8% 94%,rgba(31,50,84,.06) 0 140px,transparent 142px),
radial-gradient(circle at 96% 68%,rgba(246,201,69,.16) 0 70px,transparent 72px),
linear-gradient(180deg,#FCFAF4,#F9F5EA)}
header{position:sticky;top:0;z-index:8;background:var(--blue);color:var(--cream);margin:0 0 6px;
padding:calc(10px + env(safe-area-inset-top,0)) 14px 10px;border-bottom:3px solid var(--yel);gap:8px;justify-content:space-between}
header .brand{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0;flex:1;overflow:hidden}
header #lg{background:var(--cream);border-radius:12px;padding:3px;display:block;flex:0 0 auto}
header #lg img{border-radius:9px}
header h1{font-size:clamp(22px,7vw,30px);line-height:1.1;color:var(--but);white-space:nowrap}
header small{color:#B9C4DE;font-size:11px;display:block}
.tools{display:flex;gap:6px;flex:0 0 auto}
.tools button{background:rgba(252,238,168,.14);color:var(--but);border:1px solid rgba(252,238,168,.5);
width:38px;height:38px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.tools button.on{background:var(--but);color:var(--blue)}
@media(max-width:420px){header small{display:none}}
.hero{background:var(--blue);border-color:var(--yel);position:relative;overflow:hidden}
.hero h2,.hero p,.hero .orn{position:relative;z-index:1}
.hero .orn{color:var(--yel)}
.dz{position:absolute;z-index:0;pointer-events:none}
#welcome{background:radial-gradient(circle at 105% 6%,rgba(31,50,84,.07) 0 120px,transparent 122px),radial-gradient(circle at -8% 94%,rgba(31,50,84,.06) 0 140px,transparent 142px),linear-gradient(180deg,#FCFAF4,#F9F5EA)}
#welcome .box{border-color:var(--yel)}
.card,.paper,.tile{border-color:var(--rg)}
.sud input[readonly]{color:var(--blue)}
/* QR scanner */
#scan{position:fixed;inset:0;z-index:40;background:#0d1626;display:none;flex-direction:column;color:#fff}
#scan .top{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0)) 14px 12px;position:relative;z-index:2}
#scan video{flex:1;min-height:0;width:100%;object-fit:cover}
#scan .frame{position:absolute;left:50%;top:42%;width:62vw;max-width:260px;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid var(--yel);border-radius:24px;box-shadow:0 0 0 100vmax rgba(13,22,38,.5);pointer-events:none;z-index:1}
#scan .panel{background:var(--cream);color:var(--blue);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0));border-radius:22px 22px 0 0;position:relative;z-index:2}
#scan .panel p{margin:0 0 8px;font-size:14px}
.set label{display:flex;gap:10px;align-items:center;font-size:15px}
.set label input{width:22px;height:22px;margin:0;accent-color:var(--grn)}
.set h2 svg{color:var(--rg)}

/* flat: no boxes */
.card,.paper{background:none;border:0;border-bottom:1px solid rgba(31,50,84,.16);box-shadow:none;border-radius:0;padding:14px 2px;margin:0}
main>.card:last-child,main>.paper:last-child{border-bottom:0}
.tile{background:none;border:0;box-shadow:none;padding:12px 2px}
.note{background:none;border-radius:0;border-left:3px solid var(--rg);padding:4px 12px}
.hero{background:none;border:0;box-shadow:none;color:var(--blue);padding:16px 10px 10px;margin:6px 0 4px}
.hero h2{color:var(--blue)}
.hero .orn{color:#C9A227}
.hero .dq{font-size:15.5px;line-height:1.6;font-weight:600;color:var(--blue);margin:2px 4px 10px}
.hero .dt{font-size:13px;color:var(--mute)}
#welcome{background:radial-gradient(circle at 105% 6%,rgba(31,50,84,.17) 0 120px,transparent 122px),radial-gradient(circle at -8% 94%,rgba(31,50,84,.15) 0 140px,transparent 142px),linear-gradient(180deg,#FBF8F1,#F6F1E4)}
#welcome .box{background:none;border:0;border-radius:0;padding:12px}

.pdate{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dots{background:none;color:var(--mute);padding:4px 6px;border-radius:50%;flex:0 0 auto}
.pmn{margin:0 0 10px}.pmn p{margin:6px 0 0;font-size:12.5px;color:var(--mute)}

.lnk{background:none;border:0;border-radius:0;padding:2px 0;font-size:13px;color:var(--fu);text-decoration:underline;cursor:pointer}
.lnk.red{color:#9B2C2C}
.sep{color:var(--mute);margin:0 8px;font-size:13px}
.pmn p{font-size:11.5px;margin:4px 0 0}
.ncard{position:relative}
.ncard .dots{position:absolute;top:10px;right:0}
.item .lnk{margin-left:12px;flex:0 0 auto}

.row select.u{max-width:150px;padding-left:8px;padding-right:2px;font-size:15px}
#zoom{position:fixed;inset:0;z-index:35;background:#FCFAF4;display:none;flex-direction:column}
#zoom .zt{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--blue);color:var(--but);padding:calc(10px + env(safe-area-inset-top,0)) 12px 10px;border-bottom:3px solid var(--yel)}
#zoom .zt b{font-size:16px}
#zoom .zt button{color:var(--but);border-color:rgba(252,238,168,.6);padding:6px 12px}
#zbox{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#zimg{display:block;max-width:none;height:auto}
#ztx{white-space:pre-wrap;padding:16px;line-height:1.6}

html,body,#welcome{background:#FBF8F1 !important}
body::before{display:none !important}
#welcome{background:#FBF8F1 !important}
.dz{display:none !important}
.shelf{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px;padding:14px 8px 0;border-bottom:8px solid #6B4A2B;margin-top:10px;min-height:250px}
.bk{position:relative;width:62px;height:230px;border-radius:6px 4px 4px 6px;box-shadow:inset -4px 0 0 rgba(0,0,0,.18),0 4px 10px rgba(31,50,84,.18);display:flex;flex-direction:column;align-items:center;padding:34px 0 8px;color:#FFFBE6}
.bkdot{position:absolute;top:4px;right:2px;background:none;color:#FFFBE6;padding:2px;width:auto;height:auto;border-radius:50%}
.bkname{background:none;color:#FFFBE6;padding:0;writing-mode:vertical-rl;transform:rotate(180deg);font-family:'Great Vibes','Snell Roundhand',cursive;font-size:24px;line-height:1;max-height:170px;overflow:hidden;text-align:left;border-radius:0}
.bkn{margin-top:auto;color:#FFFBE6;opacity:.85}
.bkm{position:absolute;top:34px;left:50%;transform:translateX(-50%);z-index:5;background:#FBF8F1;color:var(--blue);border:1px solid var(--rg);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;gap:6px;white-space:nowrap;box-shadow:0 6px 16px rgba(31,50,84,.2)}
.yr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mo{background:var(--cream);border:1.5px solid var(--rg);border-radius:16px;padding:8px 6px;cursor:pointer;text-align:center;color:var(--blue)}
.mo h3{margin:0 0 4px;font-family:'Great Vibes','Snell Roundhand',cursive;font-weight:400;font-size:24px}
.mt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}
.mt th{font-weight:600;color:var(--mute);padding:3px 0}
.mt td{text-align:center;padding:1px 0}
.mt td.ex{font-size:10px;padding:2px 0}
.dd{position:relative;background:none;color:var(--blue);padding:0;width:30px;height:30px;border-radius:50%;font-size:13px}
.dd.today{background:var(--blue);color:#FFFBE6}
.dd.sel{outline:2px solid var(--fu);outline-offset:1px}
.dd.ev::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#C9A227}
.dd.today.ev::after{background:var(--yel)}
.mo .today-m{color:var(--fu)}
.glasses{display:flex;gap:6px;margin-top:6px}
.gl{width:24px;height:32px;border:1.5px solid var(--rg);border-radius:0 0 10px 10px;background:none}
.gl.on{background:#9CC8E8;border-color:var(--fu)}
.mealt td{padding:7px 2px;font-size:14px}
.mealt th{font-size:12px}
.bar{height:10px;border-radius:10px;background:#E8E2CF;overflow:hidden;margin-top:4px}.bar span{display:block;height:100%;background:var(--grn);border-radius:10px}
.tools button:disabled{opacity:.4}
.glassbtn{width:76px;height:76px;border-radius:50%;padding:0;margin:0 auto;background:#FFFDF3;border:1.5px solid var(--rg);color:var(--fu);display:flex;align-items:center;justify-content:center}
.glassbtn:disabled{opacity:.45}
</style></head>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

{k:"Mnemonic",t:"Cranial nerves: sensory or motor?",q:"Some Say Marry Money, But My Brother Says Big Brains Matter More",a:"Nerves I to XII: Sensory, Sensory, Motor, Motor, Both, Motor, Both, Sensory, Both, Both, Motor, Motor."},

{k:"Mnemonic",t:"High anion gap metabolic acidosis",q:"MUDPILES",a:"Methanol, Uraemia, DKA, Paracetamol, Iron or Isoniazid, Lactate, Ethylene glycol, Salicylates."},
{k:"Drug pearl",t:"Digoxin",q:"Which classic visual symptom warns of digoxin toxicity?",a:"Yellow-green tinted vision. Low potassium makes toxicity more likely."},
{k:"Drug pearl",t:"Amiodarone",q:"Name three organs amiodarone can harm.",a:"Lungs (fibrosis), thyroid and liver. Corneal deposits and skin discolouration also occur."},
{k:"Drug pearl",t:"ACE inhibitors",q:"Why do ACE inhibitors cause a dry cough?",a:"Bradykinin builds up. Switching to an ARB usually settles it."},
{k:"Mnemonic",t:"Newborn assessment",q:"APGAR: what do the letters stand for?",a:"Appearance, Pulse, Grimace, Activity, Respiration."}];
const QUOTES=["Some days you will be the only calm in a room full of fear. That steadiness is a treatment too. Carry it like your stethoscope.", "You did not choose medicine because it was easy. You chose it because someone's worst day deserved someone's best effort. Be that person today.", "Tired is not the same as failing. Every doctor you admire once stood exactly where you are, doubting, aching, and still showing up.", "A patient may forget your name but will remember how you made them feel. Slow down for one sentence of kindness today.", "You are allowed to not know. The brave part is saying \"let me find out\" and then truly finding out.", "Mastery is built in small, unglamorous hours: the extra history, the repeated exam, the page read after a long shift. Those hours are adding up.", "Rest is not the opposite of dedication. A sharp mind and a steady hand are built on sleep, food and one hour that belongs only to you.", "Mistakes will come. What defines you is whether you speak up, learn, and make the next patient safer because of it.", "Behind every file is a family waiting in a corridor. Treat the person first and the disease second, and you will rarely go wrong.", "Nobody walks onto the ward fully ready. You grow into it, one case at a time. Today is one more case.", "Compare yourself only with who you were last month. Can you do something now that frightened you then? That is progress.", "A bad day on the wards does not cancel the good you did last week. Both are true. Keep going.", "Your hands will learn what books can only describe. Be patient with the slow part. It is where the skill is made.", "Ask the question you fear is silly. Someone else in the room is wondering the same thing and will be grateful you spoke.", "Courage in medicine is quiet. It is the night call you answer, the hard news you deliver gently, the honest \"I am not sure\".", "When the work feels heavy, remember the one patient who walked out because of you. Hold that thought and take the next step.", "Be as gentle with yourself as you are with your patients. You cannot pour care from an empty cup.", "Discipline beats mood. Open the book for ten minutes even when you do not feel like it. Momentum will do the rest.", "Every senior you look up to was once a nervous junior who simply kept turning up prepared and kind.", "Do the small things well: the clear note, the careful dose, the kind word. Excellence is mostly small things done every day.", "You are not behind. You are on your own path, and medicine is a long road with room for every pace.", "Learn as if you will teach, and teach as if you are still learning. That is how knowledge stays alive.", "Hope is a clinical tool. A calm voice, a clear plan and a steady presence change how patients heal.", "On the days you doubt your choice, remember the first time you wore the white coat. That hopeful person is still in you.", "Take the credit lightly and the responsibility seriously, and share both with your team. Good medicine is never a solo act.", "Burnout whispers that nothing you do matters. Your patients, alive and grateful, say otherwise.", "A good doctor is made of curiosity, humility and stamina. You are building all three right now, even tonight.", "Pause before you react. In that single breath lives your best judgement.", "After a long shift, remember: you were trusted with someone's body, fear and hope. Few jobs carry such honour.", "Make one person feel safe today. Everything else in medicine is built on that.", "Progress in medicine is rarely loud. It is a steady gathering of cases, mistakes understood and lessons kept. Keep gathering."];

let ac;function tone(fs){try{ac=ac||new(window.AudioContext||webkitAudioContext)();fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.15;o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.12,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.55)})}catch(e){}}
function party(){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:20';c.width=innerWidth;c.height=innerHeight;document.body.append(c);const x=c.getContext('2d'),cl=['#1F3254','#F6C945','#FCEEA8','#3E5A94','#FFFFFF'],ps=Array.from({length:130},()=>({x:Math.random()*c.width,y:-Math.random()*c.height/2,v:2+Math.random()*3,s:5+Math.random()*5,c:cl[Math.random()*5|0],a:Math.random()*6}));let t=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/30);p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});++t<200?requestAnimationFrame(f):c.remove()})();tone([523,659,784,1047])}

const fsURL=()=>`https://firestore.googleapis.com/v1/projects/${CLOUD.projectId}/databases/(default)/documents/posts`;
async function cloudList(){const r=await fetch(`${fsURL()}?pageSize=40&orderBy=ts%20desc&key=${CLOUD.apiKey}`);if(!r.ok)throw 0;const j=await r.json();
return(j.documents||[]).map(d=>{const f=d.fields||{},g=k=>f[k]?.stringValue||'';return{id:d.name.split('/').pop(),t:g('t'),b:g('b'),img:g('img'),by:g('by'),d:g('d')}})}

body:JSON.stringify({fields:{t:{stringValue:p.t},b:{stringValue:p.b},img:{stringValue:p.img||''},by:{stringValue:p.by},d:{stringValue:p.d},ts:{integerValue:String(p.id)}}})});if(!r.ok)throw 0}
function shrink(f){return new Promise((ok,no)=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.7))};i.onerror=no;i.src=u})}

function restoreItem(x){const d=x.data;

else if(x.type==='notebook'){const b=L('nb',[]);b.push(d);S('nb',b)}

function monthGrid(y,m,ev,big){const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),tk=dk();const cells=[];
for(let i=0;i<first;i++)cells.push(0);for(let d=1;d<=days;d++)cells.push(d);while(cells.length%7)cells.push(0);
const cell=c=>{if(!c)return '<td></td>';const k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(c).padStart(2,'0');const n=(ev[k]||[]).length;

 return big?`<td><button class="${cls}" data-a="calday" data-v="${k}">${c}</button></td>`:`<td class="ex">${k===tk?'<b>'+c+'</b>':c}</td>`};
let h='<table class="mt"><tr>'+DN.map(d=>`<th>${d}</th>`).join('')+'</tr>';
for(let r=0;r<cells.length;r+=7)h+='<tr>'+cells.slice(r,r+7).map(cell).join('')+'</tr>';return h+'</table>'}

const MEALS=[['b','Breakfast',420,660,'7:00 AM','11:00 AM'],['l','Luncheon',720,840,'12:00 PM','2:00 PM'],['d','Le cena',1140,1260,'7:00 PM','9:00 PM']];
const nowM=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};

function mealState(k,m){const day=mealsAll()[k]||{};if(day[m[0]])return 'had';const tk=dk();
if(k<tk)return 'skip';if(k>tk)return 'later';const n=nowM();if(n>=m[3])return 'skip';if(n>=m[2])return 'due';return 'wait'}

<div class="card"><table class="mt mealt"><tr><th>Date</th><th>Breakfast</th><th>Luncheon</th><th>Le cena</th><th>Water</th></tr>${rows}</table></div>`;
updateGlass()}

${trashCard()}`}
function home(){const me=L('me',''),n=(L('pad',{})[dk()]||[]).filter(x=>!x.d).length;
$('#app').innerHTML=`<div class="hero"><h2>Hi ${esc(me||'doctor')}</h2><p class="dq">“${esc(QUOTES[day%QUOTES.length])}”</p><p class="dt">${n} task${n==1?'':'s'} left on your to-do list.</p></div>${mealsCard()}<div class="grid">${TABS.filter(t=>t[0]!=='home').map(t=>`<button class="tile" data-a="go" data-v="${t[0]}"><span class="ib">${ic(t[1],38)}</span><span>${t[2]}</span></button>`).join('')}</div>`}
function pad(){const p=L('pad',{}),sv=L('padSaved',{}),l=p[viewK]||[],d=new Date(viewK+'T00:00'),keys=[...new Set([dk(),...Object.keys(p)])].sort().reverse();
$('#app').innerHTML=`<select data-a="view">${keys.map(k=>`<option value="${k}" ${k===viewK?'selected':''}>${k===dk()?'Today':k}${sv[k]?' · saved':''}</option>`).join('')}</select>
<div class="paper"><div class="pdate"><div><h2>${d.toLocaleDateString('en-IN',{weekday:'long'})}</h2><small>${d.toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}${sv[viewK]?' · saved':''}</small></div><button class="dots" data-a="pmenu" aria-label="Page options"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button></div>${pmenu?`<div class="pmn"><button class="lnk" data-a="pshare">Share list</button><span class="sep">·</span><button class="lnk" data-a="psave">${sv[viewK]?'Unsave page':'Save page'}</button><span class="sep">·</span><button class="lnk red" data-a="pdel">Delete page</button><p>Unsaved pages delete after 1 month.</p></div>`:''}
${l.map((x,i)=>`<div class="line"><input type="checkbox" ${x.d?'checked':''} data-a="tick" data-v="${i}" aria-label="Done"><span>${esc(x.t)}</span><em>${x.time||''}</em><button class="x" data-a="del" data-v="${i}" aria-label="Delete">✕</button></div>`).join('')}
<div class="row" style="margin-top:8px"><input id="nt" placeholder="New task"><input id="ntm" type="time" style="max-width:110px"><button data-a="add" class="fu">+</button></div></div>
`}
let nb=-1,ed=null;
function learn(){const bs=L('nb',[]);
if(nb<0){$('#app').innerHTML=`<div class="card"><h2>${ic('book',24)} My notebooks</h2><div class="row"><input id="nn" placeholder="New notebook, e.g. Medicine"><button data-a="nbmk" class="fu">Create</button></div></div>`+'<div class="shelf">'+bs.map((b,i)=>`<div class="bk" data-a="nbopen" data-v="${i}" style="cursor:pointer;background:${SPINE[i%SPINE.length]}"><button class="dots bkdot" data-a="nbmenu" data-v="${i}" aria-label="Notebook options"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button><button class="bkname" data-a="nbopen" data-v="${i}">${esc(b.name)}</button><small class="bkn">${b.entries.length}</small>${nbmenuI===i?`<div class="bkm"><button class="lnk" data-a="nbshare" data-v="${i}">Share</button><button class="lnk red" data-a="nbdel" data-v="${i}">Delete</button></div>`:''}</div>`).join('')+'</div>';return}
const b=bs[nb];
if(ed!==null){const e=ed==='new'?{t:'',b:''}:b.entries.find(x=>x.id==ed);
$('#app').innerHTML=`<button class="ghost" data-a="ecancel">← ${esc(b.name)}</button><div class="card"><input id="et" placeholder="Title, e.g. Hyponatraemia" value="${esc(e.t)}"><textarea id="eb" style="min-height:200px" placeholder="Write here">${esc(e.b)}</textarea><div class="row"><button data-a="esave" class="fu">Save</button><button class="ghost" data-a="eshare">Share</button>${ed==='new'?'':'<button class="ghost" data-a="edel">Trash</button>'}</div></div>`;return}
$('#app').innerHTML=`<button class="ghost" data-a="nbback">← Notebooks</button><div class="card"><h2>${esc(b.name)}</h2><button data-a="enew" class="fu">+ New note</button></div>`+(b.entries.map(e=>`<div class="card ncard" data-a="eedit" data-v="${e.id}"><button class="dots" data-a="nmenu" data-v="${e.id}" aria-label="Note options"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button><small>${esc(e.d)}${e.u?' · edited '+esc(e.u):''}</small><h2 style="margin:2px 0">${esc(e.t)||'Untitled'}</h2><p style="white-space:pre-wrap;margin:0">${esc(e.b.slice(0,140))}</p>${nmenu==e.id?`<div class="pmn"><button class="lnk" data-a="nshare" data-v="${e.id}">Share note</button><span class="sep">·</span><button class="lnk red" data-a="ndel" data-v="${e.id}">Trash note</button></div>`:''}</div>`).join('')||'')}
const calcBox=(v={})=>{const o=(a,sel)=>a.map(([val,t])=>`<option value="${val}"${String(val)===String(sel)?' selected':''}>${t}</option>`).join(''),g=k=>esc(v[k]??'');
return `<div class="card"><h2>Dose calculator</h2><input id="cw" type="number" step="any" inputmode="decimal" placeholder="Weight (kg)">
<div class="row"><input id="cd" type="number" step="any" inputmode="decimal" placeholder="Dose" value="${g('d')}"><select id="cdu" class="u" aria-label="Dose unit">${o([[1440,'mg/kg/min'],[24,'mg/kg/hr'],[1,'mg/kg/day']],v.u||1)}</select></div>
<input id="cn" type="number" step="any" inputmode="decimal" placeholder="Doses per day" value="${g('n')}">
<div class="row"><input id="cm" type="number" step="any" inputmode="decimal" placeholder="Maximum dose per day" value="${g('m')}"><select id="cmu" class="u" aria-label="Maximum dose unit">${o([['day','mg/day'],['kg','mg/kg/day']],v.mu||'day')}</select></div>
<div class="row"><input id="cc" type="number" step="any" inputmode="decimal" placeholder="Strength (optional)" value="${g('s')}"><select id="ccu" class="u" aria-label="Strength unit">${o([['mgml','mg/ml'],['pc','%']],v.su||'mgml')}</select></div>
<button data-a="calc" class="fu">Calculate</button>${v.keep?'<button class="lnk" style="margin-left:14px" data-a="dkeep">Remember these settings</button>':''}<p id="cr"></p><p class="note">Always confirm the dose against your guideline.</p></div>`};
function drugs(){
if(!drugMode){$('#app').innerHTML=`<div class="card"><h2>${ic('drugs',24)} Drugs</h2><button class="big" data-a="dmode" data-v="guide">${ic('book',26)} Follow guidelines</button><button class="big fu" data-a="dmode" data-v="mine">${ic('quill',26)} Customise</button></div>`;return}
const bar=`<button class="ghost" data-a="dback">← Drugs</button><div class="tabs"><button class="${drugSub==='list'?'':'ghost'}" data-a="dsub" data-v="list">${drugMode==='guide'?'Guidelines':'My drugs'}</button><button class="${drugSub==='calc'?'':'ghost'}" data-a="dsub" data-v="calc">Calculator</button></div>`;
if(drugSub==='calc'){$('#app').innerHTML=bar+calcBox();return}
if(drugMode==='guide'){$('#app').innerHTML=bar+`<div class="card"><h2>Official sources</h2>${SOURCES.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener"><span class="tag">${s[0]}</span></a>`).join(' ')}</div>`+`<div class="card"><h2>Protocols</h2>${GUIDE.map((g,i)=>`<div class="item" data-a="gview" data-v="${i}" style="cursor:pointer"><span><b>${esc(g.h)}</b>${g.s?`<br><small>${esc(g.s)}</small>`:''}</span><span style="flex:0 0 auto;color:var(--rg);font-size:22px">›</span></div>`).join('')}</div>`;return}
const d=L('drugs',[]);
if(dOpen>=0&&d[dOpen]){const x=d[dOpen];$('#app').innerHTML=`<button class="ghost" data-a="dclose">← My drugs</button><div class="card"><h2>${esc(x.n)}</h2><input id="en" value="${esc(x.n)}" placeholder="Drug name"><input id="ed" value="${esc(x.d||'')}" placeholder="Dose, route, frequency"><input id="ep" value="${esc(x.p||'')}" placeholder="Condition it is given for"><button class="fu" data-a="dupd">Save changes</button></div>`+calcBox({...(x.k||{}),keep:1});return}
$('#app').innerHTML=bar+`<div class="card"><h2>Add a drug</h2><input id="dn" placeholder="Drug name"><input id="dd" placeholder="Dose, route, frequency"><input id="dp" placeholder="Condition it is given for"><button data-a="dsave" class="fu">Save</button></div>
<div class="card"><h2>My drugs</h2>${d.map((x,i)=>`<div class="item" data-a="dopen" data-v="${i}" style="cursor:pointer"><span><b>${esc(x.n)}</b><br>${esc(x.d)}${x.p?`<br><small>For ${esc(x.p)}</small>`:''}<br><small style="color:var(--fu);text-decoration:underline">Edit and calculate dose</small></span><button class="x" data-a="ddel" data-v="${i}" aria-label="Delete">✕</button></div>`).join('')||'<p>Nothing saved yet.</p>'}</div>`}
render();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}</script>
</body></html>
